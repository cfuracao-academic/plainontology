[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "plainontology"
version = "0.2.0"
description = "Write down the ontology and semantic layer a system already has as one plain text file: editable, diffable, exportable to OWL/SKOS and LinkML, and served to AI agents over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Furacão" }]
keywords = ["ontology", "postgresql", "mysql", "semantic layer", "knowledge graph", "skos", "owl", "linkml", "schema drift", "data dictionary", "shacl", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
postgres = ["sqlglot>=30", "sqlalchemy>=2", "psycopg[binary]>=3.1"]
mysql = ["sqlglot>=30", "sqlalchemy>=2", "pymysql>=1.1"]
all = ["plainontology[mcp,postgres,mysql]"]
dev = ["pytest>=8", "pytest-cov>=5", "rdflib>=7", "pyyaml>=6", "pyshacl>=0.26", "ruff>=0.6", "mypy>=1.10",
       "plainontology[all]"]

[project.scripts]
plainontology = "plainontology.cli:main"
plainonto = "plainontology.cli:main"

[project.urls]
Homepage = "https://github.com/cfuracao-academic/plainontology"
Issues = "https://github.com/cfuracao-academic/plainontology/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plainontology"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["plainontology"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E741",    # short names such as l in comprehensions read fine here
    "SIM108",  # if/else blocks are sometimes clearer than a ternary
    "RUF001", "RUF002", "RUF003",  # non-ASCII letters (Œuvre, Furacão) are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["src/plainontology"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
