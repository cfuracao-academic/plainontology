[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "plainontology"
version = "0.1.0"
description = "Write down the ontology and semantic layer a system already has as one plain text file: editable, diffable, exportable to OWL/SKOS and LinkML, and served to AI agents over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Furacão" }]
keywords = ["ontology", "semantic layer", "knowledge graph", "skos", "owl", "linkml", "schema drift", "data dictionary", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "rdflib>=7", "pyyaml>=6", "mcp>=2,<3"]

[project.scripts]
plainontology = "plainontology.cli:main"
plainonto = "plainontology.cli:main"

[project.urls]
Homepage = "https://github.com/cfuracao-academic/plainontology"
Issues = "https://github.com/cfuracao-academic/plainontology/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plainontology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
