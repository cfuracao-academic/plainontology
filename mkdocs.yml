site_name: PlainOntology
site_description: Write down the ontology your system already has, as one plain text file that people can edit and AI agents can read.
site_url: https://cfuracao-academic.github.io/plainontology/
repo_url: https://github.com/cfuracao-academic/plainontology
repo_name: cfuracao-academic/plainontology
edit_uri: edit/main/docs/
copyright: MIT licence. Cite with DOI 10.5281/zenodo.24562420.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

exclude_docs: |
  demo/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Sources: sources.md
  - In CI and git hooks: ci.md
  - With AI agents: agents.md
  - Performance: performance.md
  - File format: format.md
  - Changelog: changelog.md
