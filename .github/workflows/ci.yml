name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  live-databases:
    # Loads the example dumps into real servers and checks the live reader
    # returns exactly what the dump reader returns.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: library
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: library
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PLAINONTO_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/library
      PLAINONTO_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs tests/test_sql_live.py

  linkml-toolchain:
    # The LinkML export must be accepted by the LinkML tools themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . linkml
      - run: |
          cd examples
          plainonto init all.onto --from sqlite:library.sql --from jsonschema:article.schema.json --from tools:agent-tools.json
          plainonto export all.onto --to linkml -o all.yaml
          gen-json-schema all.yaml > /dev/null
          gen-pydantic all.yaml > /dev/null
          linkml-lint --validate-only all.yaml

  example-drift:
    # The example file must match its sources, as a demo of using drift as a CI gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: plainonto check --strict examples/library.onto
      - run: |
          plainonto drift examples/library.onto
