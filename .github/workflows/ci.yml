name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  quality:
    # Lint, formatting, types and a coverage floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q --cov --cov-report=term --cov-fail-under=85

  live-databases:
    # Loads the example dumps into real servers and checks the live reader
    # returns exactly what the dump reader returns.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: library
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: library
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PLAINONTO_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/library
      PLAINONTO_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q -rs tests/test_sql_live.py

  linkml-toolchain:
    # The LinkML export must be accepted by the LinkML tools themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . linkml
      - run: |
          cd examples
          plainonto init all.onto --from sqlite:library.sql --from jsonschema:article.schema.json --from tools:agent-tools.json
          plainonto export all.onto --to linkml -o all.yaml
          gen-json-schema all.yaml > /dev/null
          gen-pydantic all.yaml > /dev/null
          linkml-lint --validate-only all.yaml

  action-and-hooks:
    # Runs this repository's GitHub Action and pre-commit hooks the way users will.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: clean
        uses: ./
        with:
          file: examples/library.onto
          install: .
      - name: The example has no drift
        run: test "${{ steps.clean.outputs.drift }}" = "false"
      - name: Change a source
        run: echo "CREATE TABLE members (id INTEGER PRIMARY KEY);" >> examples/library.sql
      - id: drifted
        uses: ./
        with:
          file: examples/library.onto
          install: .
          fail-on-drift: "false"
      - name: The change is reported
        env:
          DRIFT: ${{ steps.drifted.outputs.drift }}
          REPORT: ${{ steps.drifted.outputs.report }}
        run: |
          test "$DRIFT" = "true"
          echo "$REPORT" | grep -q "concept Member"
      - run: git checkout examples/library.sql
      - run: pip install pre-commit
      - run: pre-commit try-repo . plainonto-check --files examples/library.onto
      - run: pre-commit try-repo . plainonto-drift --files examples/library.onto

  real-schemas:
    # Public sample databases at pinned versions: Pagila (PostgreSQL licence) and
    # Sakila (BSD-2-Clause). Only their schema files are downloaded; nothing is executed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[postgres,mysql]"
      - name: Extract and check Pagila and Sakila
        run: |
          mkdir real && cd real
          curl -fsSL -o pagila.sql https://raw.githubusercontent.com/devrimgunduz/pagila/6ea53f812254c91a602f61c0ef62beca3fa676b1/pagila-schema.sql
          curl -fsSL -o sakila.sql https://raw.githubusercontent.com/jOOQ/sakila/e089a5b1ec9af0df7a9c6a5d47d49fa1736a4e84/mysql-sakila-db/mysql-sakila-schema.sql
          plainonto init pagila.onto --from postgres:pagila.sql | tee pagila.out
          plainonto init sakila.onto --from mysql:sakila.sql | tee sakila.out
          plainonto check --strict pagila.onto sakila.onto
          plainonto drift pagila.onto sakila.onto
          if grep -q "warning" pagila.out sakila.out; then echo "unexpected warnings"; exit 1; fi
          test "$(grep -c '^concept' pagila.onto)" = 24
          test "$(grep -c '^concept' sakila.onto)" = 23
          grep -q '^concept Film ' pagila.onto
          grep -q '^concept Film ' sakila.onto
          grep -q 'partitioned by RANGE (payment_date) into 55 tables' pagila.onto
          grep -q 'customer -> Customer required' pagila.onto

  package:
    # Builds the sdist and wheel, checks them, then installs the wheel in clean
    # environments outside the source tree and uses it, as PyPI users will.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel with all extras and use it
        run: |
          python -m venv /tmp/full
          /tmp/full/bin/pip install "$(ls dist/*.whl)[all]"
          cp -r examples /tmp/try && cd /tmp/try
          /tmp/full/bin/plainonto --version
          /tmp/full/bin/plainonto drift library.onto
          /tmp/full/bin/plainonto init pg.onto --from postgres:library.postgres.sql
          /tmp/full/bin/plainonto init api.onto --from openapi:library.openapi.yaml
          /tmp/full/bin/plainonto export library.onto --to shacl > /dev/null
          /tmp/full/bin/python -c "import plainontology; assert plainontology.__file__.startswith('/tmp/full/'), plainontology.__file__"
      - name: Install the wheel alone (no extras) and use it
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          cd /tmp/try
          /tmp/core/bin/plainonto check library.onto
          /tmp/core/bin/plainonto drift library.onto
          if /tmp/core/bin/plainonto init x.onto --from postgres:library.postgres.sql; then exit 1; fi

  example-drift:
    # The example file must match its sources, as a demo of using drift as a CI gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: plainonto check --strict examples/library.onto
      - run: |
          plainonto drift examples/library.onto
