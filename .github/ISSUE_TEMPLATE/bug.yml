name: Bug report
description: Something extracted, merged, validated or exported wrongly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please use public or made-up data only.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `plainonto --version`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SQL source (PostgreSQL, MySQL, SQLite)
        - JSON Schema or tools source
        - refresh, drift or renames
        - check or validate
        - export (Turtle, SHACL, LinkML)
        - MCP server
        - GitHub Action or pre-commit hook
        - other
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Smallest input that shows the problem
      description: A few lines of SQL, JSON Schema or .onto text, and the command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
